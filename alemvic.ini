# =============================================================================
# Alembic Configuration
# =============================================================================

[alembic]
# Path to migration scripts
script_location = migrations

# Prepend date to migration file names
prepend_sys_path = .

# Timezone for timestamps (use UTC)
timezone = UTC

# Version path separator
version_path_separator = os

# Output encoding
output_encoding = utf-8

# Database URL (overridden by env.py using settings)
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/sentiment_intel


[post_write_hooks]
# Format migrations with black (optional)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S